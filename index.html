<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日期计数 · 间隔天数计算</title>
<meta name="description" content="计算两个日期之间的天数、周数，或从某天到今天过了多久">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#5c6bc0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日期计数">
<style>

:root{
  --bg:#f4f5f7;           /* 页面底色：浅灰，避免纯白刺眼 */
  --bg-glow:#ffffff;      /* 顶部径向光晕色，制造轻微的空间感 */
  --surface:#ffffff;      /* 卡片底色 */
  --surface-2:#fafbfc;    /* 卡片内的次级区块（输入框、结果区） */
  --text:#16181d;         /* 主文字 */
  --soft:#5d636e;         /* 次要文字 */
  --mute:#8b929e;         /* 弱化文字（提示、单位、占位符） */
  --line:#e6e8ec;         /* 分割线与边框 */
  --accent:#26a69a;       /* 强调色（各玩具不同） */
  --accent-soft:#e6f4f2;  /* 强调色的浅色版，用于底色块 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  /* 顶部一层极淡光晕，比死板的纯色更有层次 */
  background-image:radial-gradient(120% 80% at 50% 0%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}

.app{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:20px}

.head{text-align:center}
.head h1{font-size:22px; font-weight:600; letter-spacing:.5px}
.head p{font-size:13px; color:var(--mute); margin-top:6px}

.card{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow);
}

.stage{
  width:288px; height:288px; position:relative;
  background:var(--surface); border:1px solid var(--line);
  border-radius:50%; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
}
.stage canvas{border-radius:50%}

.phase{
  font-size:29px; font-weight:300; letter-spacing:6px;
  color:var(--accent); min-height:42px; text-align:center;
  transition:color .4s var(--ease);
}
.cd{font-size:15px; color:var(--soft); font-variant-numeric:tabular-nums; min-height:22px}
.meta{font-size:13px; color:var(--mute); min-height:20px; text-align:center}

.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.stats{display:flex; gap:10px; width:100%}
.stat{
  flex:1; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:12px; text-align:center;
}
.stat .k{font-size:11px; color:var(--mute); letter-spacing:1px}
.stat .v{font-size:21px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}

.chip{
  padding:9px 18px; font-size:13px; font-weight:500; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.14);
}

.btn{
  padding:13px 42px; font-size:15px; font-weight:600; font-family:inherit;
  letter-spacing:3px; background:var(--accent); color:#fff;
  border:none; border-radius:var(--r-md); cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--soft); box-shadow:none}

.lang{
  position:fixed; top:16px; right:16px; z-index:20;
  padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent); color:var(--accent)}

.hint{font-size:12px; color:var(--mute); text-align:center; line-height:1.7}

@media (max-width:380px){
  .stage{width:250px;height:250px}
  .phase{font-size:25px; letter-spacing:4px}
}

:root{ --accent:#5c6bc0; --accent-soft:#e9ebf9; }

.dfield{margin-bottom:14px}
.dfield label{display:block; font-size:12px; color:var(--mute); margin-bottom:6px; letter-spacing:1px}
input[type=date]{
  width:100%; padding:12px 14px; font-size:16px; font-family:inherit;
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--surface-2); color:var(--text);
}
input[type=date]:focus{outline:none; border-color:var(--accent); background:var(--surface)}
.big{text-align:center; padding:20px 0 8px}
.big .n{font-size:52px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-1px}
.big .u{font-size:14px; color:var(--mute); margin-top:4px}

</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="app">

  <div class="head">
    <h1 id="t_title">日期计数</h1>
  </div>

  <div class="card">
    <div class="dfield">
      <label id="t_a">开始日期</label>
      <input type="date" id="d1" onchange="calc()">
    </div>
    <div class="dfield" style="margin-bottom:0">
      <label id="t_b">结束日期</label>
      <input type="date" id="d2" onchange="calc()">
    </div>
  </div>

  <div class="card">
    <div class="big">
      <div class="n" id="n">0</div>
      <div class="u" id="u">天</div>
    </div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="k" id="t_w">折合周</div><div class="v" id="vW">0</div></div>
      <div class="stat"><div class="k" id="t_m">折合月</div><div class="v" id="vM">0</div></div>
      <div class="stat"><div class="k" id="t_y">折合年</div><div class="v" id="vY">0</div></div>
    </div>
  </div>

  <div class="row">
    <button class="btn ghost" onclick="setToday('d2')">结束设为今天</button>
    <button class="btn ghost" onclick="swapDates()">交换</button>
  </div>

  <div class="hint" id="t_hint">负数表示结束日期早于开始日期</div>

</div>
<script>

/* ============================================================
 * 日期计数
 * ------------------------------------------------------------
 * 关键陷阱：不要用 (d2 - d1) / 86400000 直接算天数。
 *   因为夏令时会让某些"一天"只有 23 小时或 25 小时，
 *   相减再除会除出小数，向下取整就少算一天。
 *
 * 正确做法：用 Date.UTC() 把两个日期都归一化到 UTC 零点的时间戳，
 *   这样每天严格等于 86400000 毫秒，差值整除即得准确天数。
 * ========================================================== */

const d1El = document.getElementById('d1');
const d2El = document.getElementById('d2');

const I18N = {
  zh:{ title:'日期计数', hint:'负数表示结束日期早于开始日期',
       a:'开始日期', b:'结束日期', day:'天', week:'折合周', month:'折合月', year:'折合年',
       today:'结束设为今天', swap:'交换', need:'请先选择两个日期' },
  en:{ title:'Day Counter', hint:'Negative means the end date is before the start',
       a:'Start date', b:'End date', day:'days', week:'Weeks', month:'Months', year:'Years',
       today:'Set end to today', swap:'Swap', need:'Please pick both dates' }
};
let lang = 'zh';

/** 按本地日期取出 yyyy-mm-dd 字符串（避免 toISOString 的时区偏移） */
function todayStr(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}

/** 把 yyyy-mm-dd 解析成 UTC 零点的毫秒时间戳 */
function toUTC(s){
  const p = s.split('-');
  return Date.UTC(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
}

/** 计算差值并刷新展示 */
function calc(){
  const a = d1El.value, b = d2El.value;
  const nEl = document.getElementById('n');
  const uEl = document.getElementById('u');

  if (!a || !b){
    nEl.textContent = '0';
    uEl.textContent = I18N[lang].need;
    setStats(0,0,0);
    return;
  }

  // 两个 UTC 零点时间戳相减，必然是 86400000 的整数倍
  const days = Math.round((toUTC(b) - toUTC(a)) / 86400000);

  nEl.textContent = days;
  uEl.textContent = I18N[lang].day;

  const ad = Math.abs(days);
  setStats(
    (ad/7).toFixed(1),
    (ad/30.44).toFixed(1),      /* 平均月长 365.25/12 */
    (ad/365.25).toFixed(2)
  );
}

function setStats(w,m,y){
  document.getElementById('vW').textContent = w;
  document.getElementById('vM').textContent = m;
  document.getElementById('vY').textContent = y;
}

function setToday(id){ document.getElementById(id).value = todayStr(); calc(); }

function swapDates(){
  const a = d1El.value;
  d1El.value = d2El.value;
  d2El.value = a;
  calc();
}

function refresh(){
  const L = I18N[lang];
  document.getElementById('t_title').textContent = L.title;
  document.getElementById('t_hint').textContent  = L.hint;
  document.getElementById('t_a').textContent     = L.a;
  document.getElementById('t_b').textContent     = L.b;
  document.getElementById('u').textContent       = L.day;
  document.getElementById('t_w').textContent     = L.week;
  document.getElementById('t_m').textContent     = L.month;
  document.getElementById('t_y').textContent     = L.year;
  document.getElementById('langBtn').textContent = (lang==='zh') ? 'EN' : '中';
}
function toggleLang(){ lang = (lang==='zh') ? 'en' : 'zh'; refresh(); }

/* 默认给个区间：今天 ~ 30 天后，进来就能看到结果 */
d1El.value = todayStr();
const t30 = new Date(Date.now() + 30*86400000);
d2El.value = t30.getFullYear() + '-' +
  String(t30.getMonth()+1).padStart(2,'0') + '-' +
  String(t30.getDate()).padStart(2,'0');

refresh();
calc();

/* ---------- PWA 注册 ----------
 * 注册 Service Worker 后本页被缓存，断网也能打开。
 * 放在最后且 catch 掉异常：即使浏览器不支持也不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
